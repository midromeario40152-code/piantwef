<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyDoors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --accent: #f3f4f6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            scroll-behavior: smooth;
        }

        /* Hiệu ứng Masonry mượt mà */
        .masonry-grid {
            columns: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { .masonry-grid { columns: 2; } }
        @media (min-width: 1024px) { .masonry-grid { columns: 3; } }
        @media (min-width: 1536px) { .masonry-grid { columns: 4; } }

        .img-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.8s ease backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .img-container {
            position: relative;
            overflow: hidden;
            border-radius: 24px; /* Bo tròn cực đại */
            cursor: zoom-in;
            background-color: #f0f0f0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .img-container:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .img-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.7) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
        }

        .img-container:hover .img-overlay {
            opacity: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        /* Modal transitions */
        .modal {
            transition: all 0.3s ease-out;
            opacity: 0;
            visibility: hidden;
            backdrop-filter: blur(0px);
        }
        
        .modal.active {
            opacity: 1;
            visibility: visible;
            backdrop-filter: blur(12px);
        }

        .modal-content {
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* Bo tròn nút */
        .btn-rounded {
            border-radius: 9999px;
        }

        .input-rounded {
            border-radius: 9999px;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-gray-100/50">
        <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between gap-8">
            <a href="#" class="text-2xl font-extrabold tracking-tighter hover:opacity-70 transition">Piscaso</a>
            
            <div class="relative flex-1 max-w-2xl hidden md:block">
                <input type="text" id="search-input" placeholder="Khám phá vẻ đẹp thế giới..." 
                    class="w-full pl-14 pr-6 py-3.5 bg-gray-100/80 border-none input-rounded focus:ring-2 focus:ring-black focus:bg-white outline-none transition-all text-sm font-medium">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>

            <div class="flex items-center gap-4">
                <button class="p-3 bg-gray-100 hover:bg-gray-200 btn-rounded transition md:hidden">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="px-6 py-3 bg-black text-white text-sm font-bold btn-rounded hover:scale-105 active:scale-95 transition shadow-lg shadow-black/10">
                    Đăng kí ngay
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[1600px] mx-auto px-6 pt-12 pb-24">
        <!-- Hero -->
        <div id="hero" class="mb-16 text-center">
            <h2 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                Không gian <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-pink-500">nghệ thuật </span><br>tuyệt vời nhất.
            </h2>
            <p class="text-gray-400 text-lg md:text-xl font-medium max-w-3xl mx-auto">
                Khám phá hàng triệu bức ảnh chất lượng cao được tuyển chọn mỗi ngày từ các nghệ sĩ hàng đầu thế giới được hỗ trợ và cộng tác bởi Trần Bảo An.
            </p>
        </div>

        <!-- Masonry Grid -->
        <div id="photo-grid" class="masonry-grid">
            <!-- Photos dynamically loaded -->
        </div>

        <!-- Footer Actions -->
        <div class="flex flex-col items-center mt-20">
            <div id="loading" class="hidden mb-8">
                <div class="flex gap-2">
                    <div class="w-2 h-2 bg-black rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-black rounded-full animate-bounce [animation-delay:0.2s]"></div>
                    <div class="w-2 h-2 bg-black rounded-full animate-bounce [animation-delay:0.4s]"></div>
                </div>
            </div>
            <button id="load-more" class="group px-10 py-4 bg-white border-2 border-black text-black btn-rounded font-bold hover:bg-black hover:text-white transition-all duration-300 flex items-center gap-3">
                Tìm hiểu thêm những điều mới mẻa
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
    </main>

    <!-- Photo Detail Modal -->
    <div id="photo-modal" class="modal fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4" onclick="closeModal(event)">
        <div class="modal-content max-w-6xl w-full bg-white rounded-[32px] overflow-hidden relative flex flex-col md:flex-row max-h-[90vh] shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeModal(event)" class="absolute top-6 right-6 text-black bg-white/80 backdrop-blur shadow-sm p-3 btn-rounded z-20 hover:bg-gray-100 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="w-full md:w-3/5 bg-gray-50 flex items-center justify-center overflow-hidden p-2">
                <img id="modal-img" src="" alt="Art detail" class="w-full h-full object-contain rounded-2xl shadow-inner">
            </div>
            
            <div class="w-full md:w-2/5 p-10 flex flex-col justify-between bg-white overflow-y-auto">
                <div>
                    <div class="flex items-center gap-4 mb-8">
                        <img id="author-img" src="" class="w-12 h-12 rounded-full border-2 border-gray-100 object-cover">
                        <div>
                            <p id="author-name" class="font-bold text-lg text-gray-900 leading-none mb-1"></p>
                            <p id="author-handle" class="text-sm text-gray-400 font-medium"></p>
                        </div>
                    </div>

                    <h3 id="photo-title" class="text-2xl font-extrabold mb-4 text-gray-900 leading-snug capitalize"></h3>
                    <p id="photo-desc" class="text-gray-500 leading-relaxed mb-8 font-medium"></p>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-gray-50 rounded-2xl">
                            <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1">Địa điểm</p>
                            <p id="photo-location" class="text-sm font-bold text-gray-700 truncate">Sáng tạo</p>
                        </div>
                        <div class="p-4 bg-gray-50 rounded-2xl">
                            <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1">Thiết bị</p>
                            <p id="photo-exif" class="text-sm font-bold text-gray-700 truncate">Chuyên nghiệp</p>
                        </div>
                    </div>
                </div>

                <div class="mt-12 flex gap-4">
                    <button id="download-btn" class="flex-1 bg-black text-white py-4 btn-rounded font-bold hover:bg-gray-800 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3 shadow-xl shadow-black/10">
                        <i class="fa-solid fa-download"></i> Tải ảnh gốc
                    </button>
                    <button class="p-4 bg-gray-100 text-gray-900 btn-rounded hover:bg-pink-50 hover:text-pink-600 transition-colors">
                        <i class="fa-solid fa-heart text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentSearch = '';
        const grid = document.getElementById('photo-grid');
        const searchInput = document.getElementById('search-input');
        const loadMoreBtn = document.getElementById('load-more');
        const loading = document.getElementById('loading');
        const modal = document.getElementById('photo-modal');

        // Hàm lấy ảnh từ Unsplash (Sử dụng Client ID demo ổn định hơn)
        async function fetchPhotos(page = 1, query = '') {
            loading.classList.remove('hidden');
            loadMoreBtn.classList.add('hidden');
            
            try {
                // Chúng tôi ưu tiên các chủ đề nghệ thuật để ảnh luôn đẹp
                const searchTerm = query || 'aesthetic, art, nature, architecture';
                const response = await fetch(`https://api.unsplash.com/search/photos?page=${page}&query=${searchTerm}&per_page=15&orientation=portrait&client_id=RzS9Y9NBS6ST95F899Oq4_t9v5928641772635`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    renderPhotos(data.results);
                } else {
                    // Fallback nếu API có vấn đề
                    renderPhotos(generateMockData(12, query));
                }
            } catch (error) {
                console.error("Lỗi:", error);
                renderPhotos(generateMockData(12, query));
            } finally {
                loading.classList.add('hidden');
                loadMoreBtn.classList.remove('hidden');
            }
        }

        // Tạo dữ liệu giả lập chất lượng cao nếu API lỗi/hết lượt
        function generateMockData(count, query) {
            return Array.from({ length: count }).map((_, i) => ({
                id: Math.random().toString(36),
                urls: { 
                    regular: `https://picsum.photos/seed/${Math.random()}/800/1200`,
                    full: `https://picsum.photos/seed/${Math.random()}/1600/2400`
                },
                user: { 
                    name: 'Trần Bảo An ' , 
                    username: 'creator_' + i,
                    profile_image: { small: `https://lh3.googleusercontent.com/a-/ALV-UjVR5C7jw_jbeWea4MUfgTq2Qx_abdGjyHZdqr6qRjlIIZRMBXhwvVb3J48KI_f9NRDRfGrvUYI3B4aroP6r94f5Ctm_Mko3dBV9eMTQomwgbD5N8ui28CUzmxxu1spRN2fXs_LS0Ym6YNU8rX7KcFDzW1JxjffHoeuBYiCf7vnneKHoONle1F-MjxtVL_y_2HXSm88mx4F7ZYXqEti9afNntBC2-2IKzPhn3FFMaoBSWIOLqbdbIJsSfdX4TDjgGjFiZ0Zti0c-4whktn4f2zaeEmgNZuL1M8jAdmOU39qthMtxKEf6t0f73IyBNObALzh5G5Id1kwmZWcUg00uvnaKX-cmlQmsjPsu_P3DZuBzhXVj03Ko4JCCtVxQ-lJnTu5q8Hc2mccAboNJ9qh_MVD8w6RVus59i2dTF-75or7E1I0ZSvHk4cKnjzM_2BRUsnZDcfjLqsDIGZQVcYM62_SbOg4uc1-hWNpQTHcdFK3dZHm2FcxsYT20UXKNkh22yc7O6jS44U7wBXkVHE65fa0s3biF-Oea1QDz34NGmH_moZtbolb5InzEx4mix4uswOcQc8lQSorEaL4dpGaMr1i3PFkbdfnZhhzohKqOA7r-GE57StKGtkFTlrbmokFmQBmUScv5Xl3xnsPgoDld5UniDdVUO6ttQmkAi6AIewZutZMMll80XYtrKH6LE_lzJz_vGFxOGpprITzCQUWyCxF6VzFhUWQP7rH_C4lwU0etB5Vzl9WsJ9AtjTAE8clXivOcymHtfsqfSWMQjeLXxxmk357_-OAQzcjtoijZOkRB3-GNcqBa9faCFmHrrcwSzkCJCQJIrwHY1AP6gwrlVmoGM7AF_fQwa542QX8GML_GQuJ2pwNANIY3WzLW9VGMu6q6A2xP4s6Qh6DCoRtc0cemQw8lFCIf4JMJ_fzvTlGNHpxCckEiU4x0_aGVgOLboJwltmbwToVFLBmiF16zFiQlPF1-dnwmJwyzkXiD0vleczHrOxNM9M6k88m-uPq-iutjUaV0eGv8WmxhJUs4ZO8OLz0MVUoG1y-zgZwNLRjD-wIEa2ssrEOY16MbqqX4wHVSuvIakKilcy9jb1AukORDEiMS1jCd6k4=s360-c-no` }
                },
                alt_description: 'Tác phẩm ' + (query || 'của Trần Bảo An'),
                location: { name: 'Quốc tế' }
            }));
        }

        function renderPhotos(photos) {
            photos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'img-item';
                item.style.animationDelay = `${(index % 12) * 0.1}s`;
                
                item.innerHTML = `
                    <div class="img-container" onclick="openModal(${JSON.stringify(photo).replace(/"/g, '&quot;')})">
                        <img src="${photo.urls.regular}" alt="${photo.alt_description}" class="w-full h-auto block transition-transform duration-700 hover:scale-110">
                        <div class="img-overlay">
                            <div class="flex items-center gap-3">
                                <img src="${photo.user.profile_image.small}" class="w-8 h-8 rounded-full border-2 border-white/50">
                                <div class="overflow-hidden">
                                    <p class="text-white text-sm font-bold truncate">${photo.user.name}</p>
                                    <p class="text-white/70 text-[10px] uppercase font-bold tracking-wider">Xem tác phẩm</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function openModal(photo) {
            document.getElementById('modal-img').src = photo.urls.regular;
            document.getElementById('author-img').src = photo.user.profile_image.small;
            document.getElementById('author-name').innerText = photo.user.name;
            document.getElementById('author-handle').innerText = '@' + photo.user.username;
            document.getElementById('photo-title').innerText = photo.alt_description || "Tác phẩm nghệ thuật độc bản";
            document.getElementById('photo-desc').innerText = "Tác phẩm này đại diện cho sự sáng tạo tuyệt vời nhất của Trần Bảo An . Mỗi chi tiết đều mang hơi thở của sự tinh tế và cảm hứng hiện đại.";
            document.getElementById('photo-location').innerText = photo.location?.name || "Không gian sáng tạo";
            
            document.getElementById('download-btn').onclick = () => {
                window.open(photo.urls.full, '_blank');
            };

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Xử lý tìm kiếm
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentSearch = searchInput.value;
                grid.innerHTML = '';
                currentPage = 1;
                fetchPhotos(currentPage, currentSearch);
                document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
            }
        });

        // Tải thêm ảnh
        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            fetchPhotos(currentPage, currentSearch);
        });

        // Khởi động ứng dụng
        window.onload = () => {
            fetchPhotos();
        };

    </script>
</body>
</html>
